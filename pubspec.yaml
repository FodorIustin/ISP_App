name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  firebase_storage: ^13.4.0
  # document translation: calls the requestTranslation function (released with
  # firebase_core 4.8, which this app is locked to; newer needs a Firebase upgrade)
  cloud_functions: 6.3.0
  # opens a translated document in the phone's own viewer
  url_launcher: ^6.3.1
  # picks a PDF or Word file to upload (Files / iCloud Drive; Android's file chooser)
  file_picker: ^13.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/logo.png